name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jarvis:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mark-LIV-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Mark-LIV-main/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run JARVIS tests
        run: python -m pytest -q

  gev:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mark-LIV-main/gods-eye-view-main/_gev-clone
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: Mark-LIV-main/gods-eye-view-main/_gev-clone/package-lock.json
      - name: Install locked GEV dependencies
        run: npm ci
      - name: Run GEV tests
        run: npm test
