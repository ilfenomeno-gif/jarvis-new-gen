<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>JARVIS</title>
</head>
<body>
  <div id="status" role="status">In attesa di JARVIS…</div>
  <main id="messages" aria-live="polite"></main>
  <form id="composer">
    <label for="messageInput">Messaggio per JARVIS</label>
    <textarea id="messageInput" rows="3" autocomplete="off" disabled></textarea>
    <button id="sendButton" type="submit" disabled>Invia</button>
  </form>
  <script nonce="{{NONCE}}" src="{{CHAT_STATE_URI}}" defer></script>
  <script src="{{SCRIPT_URI}}" defer></script>
</body>
</html>
