<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS HUD</title>
<style>
:root{
  --bg:#030b14; --bg2:#08213a; --line:#12395a; --blue:#2f8bff; --ice:#9fe3ff;
  --text:#cfe9ff; --dim:#6f93b3; --ok:#4fd1a5; --off:#ff7a7a;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;
  background:radial-gradient(ellipse at 50% 50%,var(--bg2) 0%,var(--bg) 72%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#title{position:absolute;left:20px;top:16px;pointer-events:none}
#title b{font-size:18px;font-weight:600;letter-spacing:.14em}
#state{display:block;margin-top:2px;font-size:13px;color:var(--dim)}
#legend{position:absolute;left:20px;bottom:16px;display:grid;gap:5px;font-size:12px;
  font-variant-numeric:tabular-nums;pointer-events:none}
#legend div{display:grid;grid-template-columns:62px 90px 40px;align-items:center;gap:8px;color:var(--dim)}
#legend i{display:block;height:3px;background:#0e2a45;border-radius:2px;overflow:hidden}
#legend i s{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#legend span:last-child{text-align:right;color:var(--text)}
#chat{width:min(380px,40vw);display:flex;flex-direction:column;background:rgba(3,11,20,.86);
  border-left:1px solid var(--line)}
#chat header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--line);font-size:14px}
#dot{width:9px;height:9px;border-radius:50%;background:var(--off)}
#dot.live{background:var(--ok)}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;
  white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;border:1px solid var(--blue);background:rgba(47,139,255,.12)}
.msg.assistant{align-self:flex-start;border:1px solid var(--line);background:rgba(159,227,255,.06)}
.msg.system{align-self:center;color:var(--dim);font-size:12px;padding:2px}
#form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#inp{flex:1;min-width:0;background:#061423;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
#inp:focus-visible,#send:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
#send{background:var(--blue);color:#021024;border:0;border-radius:10px;padding:0 16px;
  font:inherit;font-weight:600;cursor:pointer}
@media (max-width:760px){
  #app{flex-direction:column}
  #chat{width:100%;height:44%;border-left:0;border-top:1px solid var(--line)}
  #legend{display:none}
}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="cv" aria-label="Schermata HUD con molecole e anelli di sistema" role="img"></canvas>
    <div id="title"><b>JARVIS</b><span id="state">In avvio</span></div>
    <div id="legend" aria-hidden="true"></div>
  </main>
  <aside id="chat" aria-label="Chat">
    <header><span>Chat</span><span id="dot" title="Connessione"></span></header>
    <div id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="inp" type="text" placeholder="Scrivi a Jarvis" aria-label="Messaggio">
      <button id="send" type="submit">Invia</button>
    </form>
  </aside>
</div>

<script>
(()=>{
"use strict";
/* ============ CONFIGURAZIONE ============ */
const RINGS=[                       // ordine dal centro verso l'esterno
  {key:"gpu",   label:"GPU",    r:.30, speed:.30},
  {key:"cpu",   label:"CPU",    r:.40, speed:.22},
  {key:"ram",   label:"RAM",    r:.50, speed:.16},
  {key:"disk",  label:"Disco",  r:.60, speed:.12},
  {key:"net",   label:"Rete",   r:.70, speed:.09},
  {key:"plugin",label:"Plugin", r:.83, speed:.06, plugins:true}
];
const BLUE=[47,139,255], ICE=[159,227,255];
const API={chat:"/api/chat",plugin:"/api/plugin",events:"/events"};

/* ============ UTILITÀ ============ */
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU=Math.PI*2;
let W=1,H=1,DPR=1,t=0,S=1;
const dist2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);
  x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(resize).observe(cv.parentElement);resize();

/* ============ 3D MINIMO ============ */
function rot(p,ay,ax){
  const cy=Math.cos(ay),sy=Math.sin(ay);
  const x=p[0]*cy+p[2]*sy, z=-p[0]*sy+p[2]*cy;
  const cx=Math.cos(ax),sx=Math.sin(ax);
  return [x,p[1]*cx-z*sx,p[1]*sx+z*cx];
}
const FOCAL=560;

/* sprite sfera luminosa pre-renderizzato: un drawImage per atomo */
const sprites={};
function sprite(c){
  const key=c.join();if(sprites[key])return sprites[key];
  const s=96,k=document.createElement("canvas");k.width=k.height=s;const g=k.getContext("2d");
  const h=g.createRadialGradient(48,48,6,48,48,48);
  h.addColorStop(0,`rgba(${key},.38)`);h.addColorStop(.5,`rgba(${key},.10)`);h.addColorStop(1,`rgba(${key},0)`);
  g.fillStyle=h;g.fillRect(0,0,s,s);
  const b=g.createRadialGradient(40,38,2,48,48,20);
  b.addColorStop(0,"#fff");b.addColorStop(.32,`rgb(${key})`);b.addColorStop(1,`rgb(${c.map(v=>v*.3|0)})`);
  g.fillStyle=b;g.beginPath();g.arc(48,48,20,0,TAU);g.fill();
  return sprites[key]=k;
}

/* ============ MOLECOLE ============ */
function blob(n,R,rand){
  const a=[];
  for(let i=0;i<n;i++){
    const y=1-(i+.5)/n*2,rr=Math.sqrt(1-y*y),th=i*2.399963+rand()*.5,k=R*(.55+.45*rand());
    a.push([Math.cos(th)*rr*k,y*k,Math.sin(th)*rr*k]);
  }
  return a;
}
function nearBonds(pts,per){
  const seen=new Set(),out=[];
  pts.forEach((p,i)=>{
    pts.map((q,j)=>[j,dist2(p,q)]).filter(x=>x[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,per)
      .forEach(([j])=>{const k=i<j?i+"-"+j:j+"-"+i;if(!seen.has(k)){seen.add(k);out.push([i,j,0])}});
  });
  return out;
}
/* molecole centrali: 3 gruppi che si allontanano quando Jarvis parla */
function buildCenter(){
  const rand=rng(7),dirs=[[-.9,.25,.35],[.85,.35,-.3],[.05,-.95,.2]].map(norm);
  const atoms=[],bonds=[];
  dirs.forEach((d,m)=>{
    const c=d.map(v=>v*34),base=atoms.length;
    blob(7,26,rand).forEach((p,i)=>atoms.push({p:[p[0]+c[0],p[1]+c[1],p[2]+c[2]],r:i===0?5.4:3+rand()*2,m}));
    nearBonds(atoms.slice(base).map(a=>a.p),2).forEach(([i,j])=>bonds.push([base+i,base+j,0]));
  });
  for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){      // legami deboli tra gruppi
    let best=[0,0,1e9];
    atoms.forEach((p,i)=>{if(p.m!==a)return;atoms.forEach((q,j)=>{if(q.m!==b)return;
      const d=dist2(p.p,q.p);if(d<best[2])best=[i,j,d]})});
    bonds.push([best[0],best[1],1]);
  }
  return {atoms,bonds,dirs};
}
function smallMol(seed,n){
  const rand=rng(seed),pts=blob(n,9,rand);
  return {atoms:pts.map(p=>({p,r:2+rand()*1.4,m:0})),bonds:nearBonds(pts,2),dirs:[[0,0,0]]};
}
const center=buildCenter();
const satCache={};
const sat=(name,n=4)=>satCache[name]||(satCache[name]=smallMol(hash(name),n));

/* disegna una molecola; o = {c,E,sep,wob,alpha,lw} */
function renderMol(mol,cx,cy,sc,ay,ax,o){
  const E=o.E||0,wob=o.wob||0,alpha=o.alpha??1;
  const P=mol.atoms.map((a,i)=>{
    const p=a.p.slice();
    if(E){const d=mol.dirs[a.m];p[0]+=d[0]*E*o.sep;p[1]+=d[1]*E*o.sep;p[2]+=d[2]*E*o.sep}
    if(wob){p[0]+=Math.sin(t*7+i*1.7)*wob;p[1]+=Math.cos(t*6+i*2.3)*wob;p[2]+=Math.sin(t*5+i*.9)*wob}
    const q=rot(p,ay,ax),s=FOCAL/(FOCAL+q[2]*sc);
    return {x:cx+q[0]*sc*s,y:cy+q[1]*sc*s,z:q[2],s,r:a.r};
  });
  ctx.lineCap="round";
  for(const [i,j,faint] of mol.bonds){
    const a=P[i],b=P[j],fade=Math.min(1,Math.max(.25,1-(a.z+b.z)/260));
    ctx.strokeStyle=`rgba(${ICE},${(faint?.22:.55)*fade*alpha})`;
    ctx.lineWidth=Math.max(.8,(o.lw||1.4)*sc*(a.s+b.s)/2);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  const spr=sprite(o.c);
  ctx.globalAlpha=alpha;
  [...P].sort((a,b)=>b.z-a.z).forEach(a=>{const d=a.r*sc*a.s*4.8;ctx.drawImage(spr,a.x-d/2,a.y-d/2,d,d)});
  ctx.globalAlpha=1;
}

/* ============ STATO ============ */
const state={stats:{gpu:0,cpu:0,ram:0,disk:0,net:0},gpuName:"",plugins:[],speaking:false,level:null,live:false};
const sm={gpu:0,cpu:0,ram:0,disk:0,net:0,plugin:0};
const ang={};RINGS.forEach((r,i)=>ang[r.key]=i*1.1);
let E=0,hover=null,hits=[],mouse=null;

function pluginTarget(){const p=state.plugins;return p.length?100*p.filter(x=>x.active).length/p.length:0}

function update(dt){
  const k=Math.min(1,dt*4);
  for(const r of RINGS){
    const target=r.plugins?pluginTarget():(state.stats[r.key]||0);
    sm[r.key]+=(target-sm[r.key])*k;
    ang[r.key]+=r.speed*(1+sm[r.key]/100*.8)*dt*(RM ? .2 : 1);   // angolo crescente = senso orario
  }
  let amp=.5+.5*Math.abs(Math.sin(t*9)*Math.sin(t*2.3+1));
  if(state.level!=null)amp=state.level;
  const target=(state.speaking && !RM) ? .45+.55*amp : 0;
  E+=(target-E)*Math.min(1,dt*(state.speaking?10:4));
}

/* ============ DISEGNO ============ */
function threadCurve(cx,cy,sx,sy,bend){
  const mx=(cx+sx)/2-(sy-cy)*bend,my=(cy+sy)/2+(sx-cx)*bend;
  return [mx,my];
}
function bez(u,x0,y0,mx,my,x1,y1){
  const a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;return [a*x0+b*mx+c*x1,a*y0+b*my+c*y1];
}
function drawRing(cx,cy,R,ring,idx){
  const r=ring.r*R,load=sm[ring.key]/100,a0=ang[ring.key];
  ctx.lineWidth=1;ctx.strokeStyle=`rgba(${BLUE},.20)`;
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
  // tacche: ruotano con l'anello
  const n=72;ctx.strokeStyle=`rgba(${ICE},.30)`;ctx.beginPath();
  for(let k=0;k<n;k++){
    const a=a0+k*TAU/n,len=(k%6===0?7:3.5)*S,c=Math.cos(a),s=Math.sin(a);
    ctx.moveTo(cx+c*(r-len),cy+s*(r-len));ctx.lineTo(cx+c*(r+len),cy+s*(r+len));
  }
  ctx.stroke();
  // arco di carico
  const end=a0+Math.max(.02,load)*TAU;
  ctx.lineCap="round";
  ctx.strokeStyle=`rgba(${BLUE},.22)`;ctx.lineWidth=7*S;ctx.beginPath();ctx.arc(cx,cy,r,a0,end);ctx.stroke();
  ctx.strokeStyle=`rgba(${ICE},.9)`;ctx.lineWidth=2.4*S;ctx.beginPath();ctx.arc(cx,cy,r,a0,end);ctx.stroke();

  // satelliti
  const items=ring.plugins
    ?state.plugins.map(p=>({name:p.name,active:p.active,label:p.name}))
    :[{name:ring.key,active:true,label:`${ring.label} ${Math.round(sm[ring.key])}%`}];
  const nodeCount=items.length;
  items.forEach((it,j)=>{
    const a=a0+(ring.plugins?j*TAU/nodeCount:idx*.9);
    const sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r;
    const dim=it.active?1:.35;
    // filo dal centro al satellite
    const [mx,my]=threadCurve(cx,cy,sx,sy,Math.sin(t*.7+idx+j)*.09);
    const g=ctx.createLinearGradient(cx,cy,sx,sy);
    g.addColorStop(0,`rgba(${ICE},0)`);g.addColorStop(.3,`rgba(${ICE},${.10*dim})`);
    g.addColorStop(1,`rgba(${ICE},${(.25+.4*load)*dim})`);
    ctx.strokeStyle=g;ctx.lineWidth=Math.max(.8,1.2*S);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo(mx,my,sx,sy);ctx.stroke();
    // impulso che viaggia sul filo
    if(it.active&&!RM){
      const u=(t*(.25+load*.6)+j*.37+idx*.13)%1,[px,py]=bez(u,cx,cy,mx,my,sx,sy);
      ctx.fillStyle=`rgba(${ICE},.9)`;ctx.beginPath();ctx.arc(px,py,Math.max(1.4,2*S),0,TAU);ctx.fill();
    }
    const col=ring.plugins?BLUE:ICE;
    renderMol(sat(it.name+(ring.plugins?"p":""),ring.plugins?5:4),sx,sy,S*(ring.plugins?2.1:2.4),t*.6+j,.5,
      {c:col,alpha:dim,lw:1.2});
    if(ring.plugins)hits.push({x:sx,y:sy,r:14*S,name:it.name,active:it.active});
    // etichetta
    const showName=!ring.plugins||nodeCount<=8||(hover&&hover.name===it.name);
    if(showName){
      const cs=Math.cos(a),fs=Math.max(10,11*S);
      ctx.font=`${fs}px "Segoe UI",system-ui,sans-serif`;
      ctx.fillStyle=`rgba(207,233,255,${.9*dim})`;
      ctx.textAlign=cs>.2?"left":cs<-.2?"right":"center";ctx.textBaseline="middle";
      const off=18*S,ty=Math.abs(cs)<=.2?sy+Math.sign(Math.sin(a)||1)*off:sy;
      ctx.fillText(it.label,sx+cs*off*(Math.abs(cs)>.2?1:0),ty);
    }
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*.5*.92;S=R/414;
  hits=[];
  RINGS.forEach((r,i)=>drawRing(cx,cy,R,r,i));
  // cuore: 3 molecole blu che si separano in 3D quando Jarvis parla
  const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.3);
  halo.addColorStop(0,`rgba(${BLUE},${.18+.2*E})`);halo.addColorStop(1,`rgba(${BLUE},0)`);
  ctx.fillStyle=halo;ctx.fillRect(cx-R*.3,cy-R*.3,R*.6,R*.6);
  renderMol(center,cx,cy,S*2.0,t*.35*(RM ? .2 : 1),.4+Math.sin(t*.2)*.25,
    {c:BLUE,E,sep:30,wob:(state.speaking && !RM) ? 2.2*E : 0,lw:1.6});
  // tooltip plugin
  hover=null;
  if(mouse)for(const h of hits)if(Math.hypot(mouse.x-h.x,mouse.y-h.y)<h.r){hover=h;break}
  cv.style.cursor=hover?"pointer":"default";
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

cv.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top}});
cv.addEventListener("mouseleave",()=>mouse=null);
cv.addEventListener("click",()=>{if(!hover)return;const p=state.plugins.find(x=>x.name===hover.name);
  if(!p)return;if(demo){p.active=!p.active}else post(API.plugin,{name:p.name})});

/* ============ LEGENDA ============ */
const legend=$("#legend");
legend.innerHTML=RINGS.map(r=>`<div><span>${r.label}</span><i><s id="b_${r.key}"></s></i><span id="v_${r.key}">0%</span></div>`).join("");
setInterval(()=>{
  RINGS.forEach(r=>{const v=Math.round(sm[r.key]);
    $("#b_"+r.key).style.width=v+"%";
    $("#v_"+r.key).textContent=r.plugins?`${state.plugins.filter(p=>p.active).length}/${state.plugins.length}`:v+"%"});
  $("#state").textContent=!state.live?"Demo, non collegato a Jarvis":state.speaking?"Sta parlando":"In ascolto";
},300);

/* ============ CHAT ============ */
const log=$("#log"),inp=$("#inp");
function addMsg(role,text){
  const d=document.createElement("div");d.className="msg "+role;d.textContent=text;log.appendChild(d);
  while(log.children.length>200)log.firstChild.remove();log.scrollTop=log.scrollHeight;
}
function post(url,body){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-HUD":"1"},body:JSON.stringify(body)})
    .catch(()=>addMsg("system","Connessione persa: messaggio non inviato"));
}
$("#form").addEventListener("submit",e=>{
  e.preventDefault();const text=inp.value.trim();if(!text)return;inp.value="";addMsg("user",text);
  if(demo){demoReply(text)}else post(API.chat,{text});
});

/* ============ COLLEGAMENTO A JARVIS (SSE) ============ */
function handle(m){
  switch(m.type){
    case "hello":Object.assign(state.stats,m.stats||{});state.gpuName=m.gpu_name||"";
      state.plugins=m.plugins||[];state.speaking=!!m.speaking;break;
    case "stats":Object.assign(state.stats,m.stats||{});if(m.gpu_name)state.gpuName=m.gpu_name;break;
    case "plugins":state.plugins=m.items||[];break;
    case "speak":state.speaking=!!m.on;state.level=m.level??null;break;
    case "chat":addMsg(m.role||"assistant",m.text||"");break;
  }
}
let demo=false,demoTimer=null,es=null;
function setLive(v){state.live=v;$("#dot").classList.toggle("live",v)}
function connect(){
  if(location.protocol==="file:"){startDemo();return}
  es=new EventSource(API.events);
  es.onopen=()=>{setLive(true);stopDemo()};
  es.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}};
  es.onerror=()=>{setLive(false);startDemo()};
}
function startDemo(){
  if(demo)return;demo=true;setLive(false);
  state.plugins=["gev_plugin","browser","files","spotify","calendar","vision"].map(n=>({name:n,active:n!=="vision"}));
  addMsg("system","Modalità demo: apri l’HUD dal ponte Python per collegarlo a Jarvis");
  const walk=(v,a)=>Math.max(2,Math.min(98,v+(Math.random()-.5)*a));
  demoTimer=setInterval(()=>{const s=state.stats;
    s.gpu=walk(s.gpu||30,25);s.cpu=walk(s.cpu||25,20);s.ram=walk(s.ram||55,6);s.disk=walk(s.disk||40,3);s.net=walk(s.net||15,30)},900);
}
function stopDemo(){if(!demo)return;demo=false;clearInterval(demoTimer);state.plugins=[]}
function demoReply(text){
  setTimeout(()=>{addMsg("assistant","Ricevuto: "+text);state.speaking=true;
    setTimeout(()=>state.speaking=false,2600)},400);
}
connect();
})();
</script>
</body>
</html>
